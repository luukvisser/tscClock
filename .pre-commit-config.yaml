repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: check-merge-conflict
          - id: check-added-large-files

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.8.4
      hooks:
          - id: prettier
            files: \.(js|json|md|ya?ml)$

    - repo: local
      hooks:
          - id: qmlformat
            name: qmlformat
            language: python
            additional_dependencies: [PySide6==6.11.1]
            entry: pyside6-qmlformat -i
            files: \.qml$

          - id: qmllint
            name: qmllint
            language: python
            additional_dependencies: [PySide6==6.11.1]
            entry: pyside6-qmllint
            files: \.qml$
